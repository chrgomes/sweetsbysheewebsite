name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sweets
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sweets_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sweets" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sweets@localhost:5432/sweets_test
      E2E_DATABASE_URL: postgres://sweets@localhost:5432/sweets_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql postgres://sweets@localhost:5432/postgres -c "CREATE DATABASE sweets_e2e"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
